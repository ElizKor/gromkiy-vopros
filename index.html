<script>
'use strict';

// ============ QUESTIONS ============
const QUESTIONS = [

  {q:"Автор «Войны и мира»", a:["толстой","лев толстой"]},

  {q:"Какое животное называют «кораблём пустыни»?", a:["верблюд"]},
  {q:"Сколько лет Илья Муромец сидел на печи?", a:["33","тридцать три"]},
  {q:"В каком месяце меньше всего дней?", a:["февраль"]},
  {q:"Сколько республик входило в состав СССР?", a:["15","пятнадцать"]},
  {q:"Любимый инструмент Шерлока Холмса", a:["скрипка"]},
  {q:"Кто написал «Мойдодыр»?", a:["чуковский","корней чуковский"]},
];

// ============ UTILS ============
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;
      else if (k === 'disabled') el.disabled = !!v;
      else el.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}
function norm(s) { return String(s || '').toLowerCase().replace(/[^а-яёa-z0-9]/g, ''); }
function checkAnswer(playerAnswer, acceptable) {
  const n = norm(playerAnswer);
  if (!n) return false;
  return acceptable.some(a => {
    const na = norm(a);
    if (!na) return false;
    return n === na || (na.length >= 4 && n.includes(na));
  });
}
function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============ MUSIC PLAYER (procedural beat) ============
const musicPlayer = (() => {
  let ctx = null, master = null;
  let isPlaying = false, scheduleTimer = null;
  let nextNoteTime = 0, currentStep = 0;
  const BPM = 128, STEP_TIME = 60 / BPM / 4, TOTAL_STEPS = 16;
  const bassPattern = [55, 55, 65.4, 65.4, 49, 49, 43.6, 43.6];

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.7;
    master.connect(ctx.destination);
  }
  function kick(t) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.08);
    g.gain.setValueAtTime(1.0, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.3);
  }
  function hat(t) {
    if (!ctx) return;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.05), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    src.connect(f).connect(g).connect(master);
    src.start(t); src.stop(t + 0.05);
  }
  function snare(t) {
    if (!ctx) return;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.2), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.45, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.connect(f).connect(g).connect(master);
    src.start(t); src.stop(t + 0.2);
  }
  function bass(t, freq) {
    if (!ctx) return;
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = freq;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 350;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + STEP_TIME * 1.5);
    o.connect(f).connect(g).connect(master);
    o.start(t); o.stop(t + STEP_TIME * 1.5);
  }
  function scheduleStep(step, t) {
    if (step % 4 === 0) kick(t);
    if (step === 4 || step === 12) snare(t);
    if (step % 2 === 0) hat(t);
    if (step % 2 === 0) bass(t, bassPattern[Math.floor(step / 2) % 8]);
  }
  function scheduler() {
    if (!ctx) return;
    while (nextNoteTime < ctx.currentTime + 0.1) {
      scheduleStep(currentStep, nextNoteTime);
      nextNoteTime += STEP_TIME;
      currentStep = (currentStep + 1) % TOTAL_STEPS;
    }
  }
  return {
    prime() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
    start() {
      init();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (isPlaying) return;
      isPlaying = true;
      nextNoteTime = ctx.currentTime + 0.05;
      currentStep = 0;
      scheduler();
      scheduleTimer = setInterval(scheduler, 25);
    },
    stop() {
      isPlaying = false;
      if (scheduleTimer) clearInterval(scheduleTimer);
      scheduleTimer = null;
    },
    setVolume(v) { if (master) master.gain.value = v; },
    isPlaying() { return isPlaying; },
  };
})();

// ============ HOST STATE ============
const hostState = {
  code: null, phase: 'lobby', qIndex: 0, timeLeft: 60, timerId: null,
  questions: [], players: [],
  teamScore: 0, roundWon: null, roundReason: '',
};

let peer = null;
let connections = new Map();
let hostConn = null;
let currentHostKey = null;
let currentPlayerScreen = null;

const app = document.getElementById('app');
function showScreen(builder) { app.innerHTML = ''; builder(app); }

// ============ HOME ============
function homeScreen() {
  showScreen(el => {
    el.appendChild(h('div', {class:'center'},
      h('h1', {}, 'Громкий вопрос'),
      h('p', {class:'sub', style:{marginBottom:'8px'}}, 'Объясни без слов'),
      h('p', {class:'sub', style:{marginBottom:'32px', fontSize:'13px'}},
        'Ведущий видит вопрос и показывает его жестами. Игроки смотрят на него, но у каждого в телефоне громко играет музыка — они не слышат ни ведущего, ни друг друга. Победа — если все дали одинаковый правильный ответ.'),
      h('button', {class:'btn primary', onclick: startHost}, 'Я ведущий'),
      h('button', {class:'btn', onclick: joinScreen}, 'Я игрок'),
    ));
  });
}

// ============ HOST ============
const ROOM_PREFIX = 'gromkiy-vopros-v2-';

function startHost() {
  showScreen(el => {
    el.appendChild(h('div', {class:'center'},
      h('h2', {}, 'Создаём комнату…'),
      h('p', {class:'sub'}, 'Подождите секунду'),
    ));
  });
  hostState.code = randomCode();
  hostState.phase = 'lobby';
  hostState.qIndex = 0;
  hostState.players = [];
  hostState.questions = [];
  hostState.teamScore = 0;
  hostState.roundWon = null;
  hostState.roundReason = '';
  clearInterval(hostState.timerId);
  connections.clear();
  currentHostKey = null;

  if (peer) { try { peer.destroy(); } catch(e) {} }
  peer = new Peer(ROOM_PREFIX + hostState.code, {debug: 1});
  peer.on('open', () => renderHostLobby());
  peer.on('connection', onPlayerConnect);
  peer.on('error', (err) => {
    console.error(err);
    if (err.type === 'unavailable-id') {
      try { peer.destroy(); } catch(e) {}
      startHost();
    } else {
      alert('Ошибка соединения: ' + err.type);
      location.reload();
    }
  });
}

function onPlayerConnect(conn) {
  conn.on('data', (data) => {
    if (data.type === 'join') {
      if (hostState.players.some(p => p.id === conn.peer)) return;
      hostState.players.push({
        id: conn.peer, name: (data.name || 'Игрок').slice(0, 20),
        conn, answer: null,
      });
      connections.set(conn.peer, conn);
      broadcast();
    } else if (data.type === 'answer') {
      const player = hostState.players.find(p => p.id === conn.peer);
      if (player && hostState.phase === 'question' && player.answer == null) {
        player.answer = String(data.text || '').slice(0, 80);
        broadcast();
      }
    }
  });
  conn.on('close', () => {
    hostState.players = hostState.players.filter(p => p.id !== conn.peer);
    connections.delete(conn.peer);
    broadcast();
  });
}

function publicState() {
  const s = hostState;
  const q = s.questions[s.qIndex];
  const showAnswer = s.phase === 'reveal' || s.phase === 'final';
  return {
    phase: s.phase, qIndex: s.qIndex, totalQ: s.questions.length, timeLeft: s.timeLeft,
    question: (s.phase === 'question' || s.phase === 'reveal') && q ? q.q : null,
    correctAnswer: showAnswer && q ? q.a[0] : null,
    players: s.players.map(p => ({
      name: p.name,
      answered: p.answer != null,
      answer: showAnswer ? p.answer : null,
    })),
    teamScore: s.teamScore,
    roundWon: s.roundWon,
    roundReason: s.roundReason,
  };
}

function broadcast() {
  const pub = publicState();
  for (const conn of connections.values()) {
    try { conn.send({type:'state', state: pub}); } catch(e) {}
  }
  if (hostState.phase === 'lobby') renderHostLobby();
  else renderHostGame();
}

function startTimer() {
  clearInterval(hostState.timerId);
  hostState.timeLeft = 60;
  broadcast();
  hostState.timerId = setInterval(() => {
    if (hostState.phase !== 'question') { clearInterval(hostState.timerId); return; }
    hostState.timeLeft--;
    if (hostState.timeLeft <= 0) {
      hostState.timeLeft = 0;
      clearInterval(hostState.timerId);
      revealAnswer();
    } else broadcast();
  }, 1000);
}

function startGame(count) {
  hostState.questions = shuffle(QUESTIONS).slice(0, count);
  hostState.qIndex = 0;
  hostState.teamScore = 0;
  hostState.players.forEach(p => { p.answer = null; });
  hostState.roundWon = null;
  hostState.roundReason = '';
  hostState.phase = 'question';
  currentHostKey = null;
  startTimer();
}

function evaluateRound() {
  const s = hostState;
  const q = s.questions[s.qIndex];
  if (s.players.length === 0) {
    return { won: false, reason: 'Нет игроков.' };
  }
  const notAnswered = s.players.filter(p => p.answer == null);
  if (notAnswered.length > 0) {
    return { won: false, reason: 'Не все успели ответить.' };
  }
  const answers = s.players.map(p => norm(p.answer));
  const first = answers[0];
  const allSame = answers.every(a => a === first);
  if (!allSame) {
    return { won: false, reason: 'Ответы не совпали — все должны были ответить одинаково.' };
  }
  const correct = checkAnswer(s.players[0].answer, q.a);
  if (!correct) {
    return { won: false, reason: 'Все ответили одинаково, но это неверный ответ.' };
  }
  return { won: true, reason: 'Все дали одинаковый правильный ответ!' };
}

function revealAnswer() {
  clearInterval(hostState.timerId);
  if (hostState.phase !== 'question') return;
  const result = evaluateRound();
  hostState.roundWon = result.won;
  hostState.roundReason = result.reason;
  if (result.won) hostState.teamScore++;
  hostState.phase = 'reveal';
  broadcast();
}

function nextQuestion() {
  clearInterval(hostState.timerId);
  hostState.qIndex++;
  if (hostState.qIndex >= hostState.questions.length) {
    hostState.phase = 'final';
    broadcast();
    return;
  }
  hostState.players.forEach(p => { p.answer = null; });
  hostState.roundWon = null;
  hostState.roundReason = '';
  hostState.phase = 'question';
  currentHostKey = null;
  startTimer();
}

// ============ HOST RENDER ============
function renderHostLobby() {
  currentHostKey = null;
  showScreen(el => {
    const countSel = h('select', {class:'select'},
      h('option', {value:'5'}, '5 вопросов'),
      h('option', {value:'8'}, '8 вопросов'),
      h('option', {value:'10'}, '10 вопросов'),
      h('option', {value:'15'}, '15 вопросов'),
    );
    countSel.value = '8';
    const btn = h('button', {class:'btn primary'}, 'Начать игру');
    if (hostState.players.length === 0) {
      btn.disabled = true;
      btn.textContent = 'Ждём игроков…';
    } else {
      btn.onclick = () => startGame(parseInt(countSel.value, 10));
    }
    el.appendChild(h('div', {},
      h('div', {class:'badge'}, 'Ведущий'),
      h('h1', {}, 'Комната создана'),
      h('div', {class:'room-code'}, hostState.code),
      h('p', {class:'sub', style:{textAlign:'center'}}, 'Скажите игрокам этот код'),
      h('div', {class:'music-bar', style:{marginTop:'16px'}},
        h('span', {class:'icon'}, '🎵'),
        h('span', {class:'label'}, 'На телефонах игроков во время раунда будет громко играть музыка'),
      ),
      h('h3', {}, 'Игроки: ' + hostState.players.length),
      h('div', {class:'players'}, ...hostState.players.map(p => h('div', {class:'chip'}, p.name))),
      countSel, btn,
    ));
  });
}

function renderHostGame() {
  const s = hostState;
  if (s.phase === 'lobby') { renderHostLobby(); return; }
  const q = s.questions[s.qIndex];
  const answeredCount = s.players.filter(p => p.answer != null).length;

  // Incremental update: same question, same answered count → just tick the timer.
  if (s.phase === 'question' && currentHostKey === ('question:' + s.qIndex + ':' + answeredCount)) {
    const t = document.querySelector('.timer');
    if (t) {
      t.textContent = String(s.timeLeft);
      t.classList.toggle('danger', s.timeLeft <= 10);
    }
    return;
  }

  // Build new key for this render
  currentHostKey = s.phase + ':' + s.qIndex + ':' + answeredCount;

  showScreen(el => {
    const wrap = h('div', {});
    wrap.appendChild(h('div', {class:'progress'}, `Вопрос ${s.qIndex + 1} из ${s.questions.length}`));
    wrap.appendChild(h('div', {class:'timer' + (s.timeLeft <= 10 ? ' danger' : '')}, String(s.timeLeft)));

    if (s.phase === 'question') {
      wrap.appendChild(h('div', {class:'question', style:{marginBottom:'14px'}}, q.q));
      wrap.appendChild(h('div', {class:'look-at-host', style:{padding:'18px'}},
        h('span', {class:'emoji'}, '🙌'),
        h('div', {class:'title'}, 'Показывайте вопрос жестами!'),
        h('div', {class:'hint'}, 'Игроки вас не слышат — только смотрят. Правильный ответ вы увидите вместе со всеми в конце раунда.'),
      ));
      wrap.appendChild(h('h3', {}, `Ответили: ${answeredCount} из ${s.players.length}`));
      s.players.forEach((p, i) => {
        wrap.appendChild(h('div', {class:'row' + (p.answer != null ? ' done' : ''), 'data-player-row': String(i)},
          h('span', {}, p.name),
          h('span', {class:'mark'}, p.answer != null ? '✓' : '…'),
        ));
      });
      wrap.appendChild(h('button', {
        class:'btn primary', style:{marginTop:'16px'},
        onclick: () => { clearInterval(s.timerId); revealAnswer(); },
      }, answeredCount === s.players.length ? 'Все ответили — открыть' : 'Завершить раунд'));
    } else if (s.phase === 'reveal') {
      const win = s.roundWon;
      wrap.appendChild(h('div', {class:'result-hero ' + (win ? 'win' : 'lose')},
        h('div', {class:'big'}, win ? '✅ ПОБЕДА!' : '❌ ПРОИГРАЛИ'),
        h('div', {class:'reason'}, s.roundReason),
      ));
      wrap.appendChild(h('div', {class:'answer-box'},
        h('div', {class:'label'}, 'Правильный ответ'),
        h('div', {class:'answer'}, q.a[0]),
      ));
      wrap.appendChild(h('h3', {}, 'Ответы игроков'));
      const answers = s.players.map(p => norm(p.answer || ''));
      const first = answers[0];
      const allSame = answers.length > 0 && answers.every(a => a === first && a !== '');
      s.players.forEach(p => {
        const cls = allSame ? 'same' : 'diff';
        wrap.appendChild(h('div', {class:'answer-line ' + cls},
          h('span', {class:'who'}, p.name + ':'),
          h('span', {class:'what'}, p.answer || '—'),
        ));
      });
      wrap.appendChild(h('div', {class:'team-score'},
        'Командный счёт: ', h('b', {}, String(s.teamScore)), ` из ${s.qIndex + 1}`,
      ));
      const last = s.qIndex + 1 >= s.questions.length;
      wrap.appendChild(h('button', {class:'btn primary', onclick: nextQuestion},
        last ? 'Показать итоги' : 'Следующий вопрос'));
    } else if (s.phase === 'final') {
      const total = s.questions.length;
      const pct = total ? Math.round(s.teamScore / total * 100) : 0;
      wrap.appendChild(h('div', {class:'result-hero ' + (s.teamScore > total / 2 ? 'win' : 'lose')},
        h('div', {class:'big'}, `${s.teamScore} / ${total}`),
        h('div', {class:'reason'}, `Вы угадали ${pct}% вопросов командой`),
      ));
      wrap.appendChild(h('button', {class:'btn primary', onclick: () => {
        s.phase = 'lobby';
        s.qIndex = 0;
        s.teamScore = 0;
        s.roundWon = null;
        s.roundReason = '';
        s.players.forEach(p => { p.answer = null; });
        broadcast();
      }}, 'Играть снова'));
    }
    el.appendChild(wrap);
  });
}

// ============ PLAYER ============
const playerState = {
  name: null, code: null, lastQIndex: -1, myAnswer: '', submitted: false,
  state: null, musicVolume: 0.7,
};

function joinScreen() {
  showScreen(el => {
    const nameInput = h('input', {class:'input', placeholder:'Ваше имя', maxlength:'20', autocomplete:'off'});
    const codeInput = h('input', {class:'input', placeholder:'Код комнаты', maxlength:'6', autocomplete:'off', style:{textTransform:'uppercase'}});
    const btn = h('button', {class:'btn primary', onclick: () => {
      const name = nameInput.value.trim();
      const code = codeInput.value.trim().toUpperCase();
      if (!name) { nameInput.focus(); return; }
      if (code.length < 4) { codeInput.focus(); return; }
      // Prime audio context on this user gesture
      musicPlayer.prime();
      connectToHost(code, name);
    }}, 'Войти');
    codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
    el.appendChild(h('div', {},
      h('h2', {style:{marginBottom:'20px'}}, 'Присоединиться'),
      nameInput, codeInput, btn,
      h('button', {class:'btn ghost', onclick: homeScreen}, 'Назад'),
    ));
  });
}

function connectToHost(code, name) {
  playerState.name = name;
  playerState.code = code;
  playerState.lastQIndex = -1;
  playerState.submitted = false;
  playerState.myAnswer = '';
  playerState.state = null;
  currentPlayerScreen = null;

  showScreen(el => {
    el.appendChild(h('div', {class:'center'},
      h('h2', {}, 'Подключаемся…'),
      h('p', {class:'sub'}, 'Комната ' + code),
    ));
  });

  if (peer) { try { peer.destroy(); } catch(e) {} }
  peer = new Peer({debug: 1});
  peer.on('open', () => {
    hostConn = peer.connect(ROOM_PREFIX + code, {reliable: true});
    hostConn.on('open', () => { hostConn.send({type: 'join', name}); });
    hostConn.on('data', (data) => {
      if (data.type === 'state') {
        playerState.state = data.state;
        renderPlayer();
      }
    });
    hostConn.on('close', () => {
      musicPlayer.stop();
      alert('Соединение с ведущим потеряно');
      location.reload();
    });
  });
  peer.on('error', (err) => {
    console.error(err);
    alert('Не удалось подключиться: ' + err.type + '. Проверьте код комнаты.');
    joinScreen();
  });
}

function renderPlayer() {
  const s = playerState.state;
  if (!s) return;

  if (s.phase === 'question' && playerState.lastQIndex !== s.qIndex) {
    playerState.lastQIndex = s.qIndex;
    playerState.submitted = false;
    playerState.myAnswer = '';
  }

  // Music control: start on question, stop on reveal/final/lobby
  if (s.phase === 'question') {
    if (!musicPlayer.isPlaying()) {
      musicPlayer.setVolume(playerState.musicVolume);
      musicPlayer.start();
    }
  } else {
    if (musicPlayer.isPlaying()) musicPlayer.stop();
  }

  let key;
  if (s.phase === 'lobby') key = 'lobby';
  else if (s.phase === 'question') key = 'q' + s.qIndex + (playerState.submitted ? ':sub' : '');
  else if (s.phase === 'reveal') key = 'r' + s.qIndex;
  else if (s.phase === 'final') key = 'final';
  else key = 'unknown';

  if (currentPlayerScreen === key) {
    const t = document.querySelector('.timer');
    if (t && s.phase === 'question') {
      t.textContent = String(s.timeLeft);
      t.classList.toggle('danger', s.timeLeft <= 10);
    }
    return;
  }
  currentPlayerScreen = key;

  if (s.phase === 'lobby') {
    showScreen(el => {
      el.appendChild(h('div', {class:'center'},
        h('div', {class:'badge'}, 'Игрок'),
        h('h1', {}, 'Вы в комнате'),
        h('p', {class:'sub'}, 'Ждём начала. Проверьте звук телефона.'),
        h('div', {class:'players', style:{marginTop:'20px'}}, ...s.players.map(p =>
          h('div', {class:'chip' + (p.name === playerState.name ? ' me' : '')}, p.name)
        )),
        h('div', {class:'music-bar', style:{marginTop:'24px', textAlign:'left'}},
          h('span', {class:'icon'}, '🔊'),
          h('span', {class:'label', style:{color:'#fca5a5'}}, 'Во время раунда у вас в телефоне будет громко играть музыка'),
        ),
      ));
    });
    return;
  }

  if (s.phase === 'question') {
    showScreen(el => {
      const wrap = h('div', {});
      wrap.appendChild(h('div', {class:'progress'}, `Вопрос ${s.qIndex + 1} из ${s.totalQ}`));
      wrap.appendChild(h('div', {class:'timer' + (s.timeLeft <= 10 ? ' danger' : '')}, String(s.timeLeft)));

      wrap.appendChild(h('div', {class:'look-at-host'},
        h('span', {class:'emoji'}, '👀'),
        h('div', {class:'title'}, 'ВНИМАНИЕ НА ВЕДУЩЕГО'),
        h('div', {class:'hint'}, 'Он показывает вопрос жестами. Вы не слышите ни его, ни других.'),
      ));

      const vol = h('input', {
        type:'range', min:'0.1', max:'1', step:'0.05',
        value: String(playerState.musicVolume),
        oninput: (e) => {
          playerState.musicVolume = parseFloat(e.target.value);
          musicPlayer.setVolume(playerState.musicVolume);
        },
      });
      wrap.appendChild(h('div', {class:'music-bar'},
        h('span', {class:'icon'}, '🎵'),
        h('span', {class:'label'}, 'Музыка играет — так надо'),
        vol,
      ));

      if (playerState.submitted) {
        wrap.appendChild(h('div', {class:'submitted'}, 'Ответ принят ✓'));
        wrap.appendChild(h('p', {class:'sub', style:{textAlign:'center'}}, 'Ждём остальных… Музыка продолжает играть.'));
      } else {
        const input = h('input', {class:'input', placeholder:'Ваш ответ (одним словом)', autocomplete:'off', maxlength:'60'});
        input.value = playerState.myAnswer;
        const submit = () => {
          const v = input.value.trim();
          if (!v) { input.focus(); return; }
          playerState.myAnswer = v;
          playerState.submitted = true;
          try { hostConn.send({type: 'answer', text: v}); } catch(e) {}
          renderPlayer();
        };
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        wrap.appendChild(input);
        wrap.appendChild(h('button', {class:'btn primary', onclick: submit}, 'Ответить'));
      }
      el.appendChild(wrap);
    });
    return;
  }

  if (s.phase === 'reveal') {
    showScreen(el => {
      const wrap = h('div', {});
      wrap.appendChild(h('div', {class:'progress'}, `Вопрос ${s.qIndex + 1} из ${s.totalQ}`));

      const win = s.roundWon;
      wrap.appendChild(h('div', {class:'result-hero ' + (win ? 'win' : 'lose')},
        h('div', {class:'big'}, win ? '✅ ПОБЕДА' : '❌ ПРОИГРАЛИ'),
        h('div', {class:'reason'}, s.roundReason),
      ));

      wrap.appendChild(h('div', {class:'answer-box'},
        h('div', {class:'label'}, 'Правильный ответ'),
        h('div', {class:'answer'}, s.correctAnswer || '—'),
      ));

      wrap.appendChild(h('h3', {}, 'Ваши ответы'));
      const answers = s.players.map(p => norm(p.answer || ''));
      const first = answers[0];
      const allSame = answers.length > 0 && answers.every(a => a === first && a !== '');
      s.players.forEach(p => {
        const cls = allSame ? 'same' : 'diff';
        wrap.appendChild(h('div', {class:'answer-line ' + cls},
          h('span', {class:'who'}, p.name + ':'),
          h('span', {class:'what'}, p.answer || '—'),
        ));
      });

      wrap.appendChild(h('div', {class:'team-score'},
        'Командный счёт: ', h('b', {}, String(s.teamScore)), ` из ${s.qIndex + 1}`,
      ));
      wrap.appendChild(h('p', {class:'sub', style:{textAlign:'center'}}, 'Ждём следующего вопроса…'));
      el.appendChild(wrap);
    });
    return;
  }

  if (s.phase === 'final') {
    const total = s.totalQ;
    const pct = total ? Math.round(s.teamScore / total * 100) : 0;
    showScreen(el => {
      el.appendChild(h('div', {class:'center', style:{width:'100%'}},
        h('h1', {}, 'Игра окончена!'),
        h('div', {class:'result-hero ' + (s.teamScore > total / 2 ? 'win' : 'lose')},
          h('div', {class:'big'}, `${s.teamScore} / ${total}`),
          h('div', {class:'reason'}, `Вы угадали ${pct}% вопросов командой`),
        ),
        h('p', {class:'sub'}, 'Ведущий может начать новую игру'),
      ));
    });
    return;
  }
}

// ============ INIT ============
homeScreen();
</script>
</body>
</html>
